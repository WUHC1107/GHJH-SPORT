<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GHJH SPORT</title>
  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-card: #121824;
      --bg-card-active: #1a2336;
      --border-card: #1f2b42;
      
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-emerald: #10b981;
      --accent-gold: #fbbf24;
      
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --text-amber: #fde68a;
      --text-emerald: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: env(safe-area-inset-top, 4px) env(safe-area-inset-right, 4px) env(safe-area-inset-bottom, 4px) env(safe-area-inset-left, 4px);
    }

    /* 頂部控制列 */
    header {
      flex: 0 0 auto;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #60a5fa;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 100%;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      height: 32px;
      min-width: 34px;
      padding: 0 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.15s ease;
      position: relative;
    }

    .icon-btn:active {
      transform: scale(0.95);
      background: #334155;
    }

    .icon-btn.active-amber {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.15);
    }

    .icon-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 總圈數設定膠囊 */
    .lap-setting-pill {
      display: flex;
      align-items: center;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      height: 32px;
      padding: 0 4px;
      gap: 2px;
    }

    .lap-setting-pill span {
      font-size: 0.75rem;
      font-weight: 700;
      color: #cbd5e1;
      padding: 0 2px;
      white-space: nowrap;
    }

    .lap-step-btn {
      background: #1f2937;
      border: none;
      color: #9ca3af;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lap-step-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    /* 重設按鈕長按環 */
    .reset-btn {
      position: relative;
      overflow: hidden;
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .reset-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: rgba(239, 68, 68, 0.35);
      transition: width 0.05s linear;
      pointer-events: none;
    }

    /* 頂部即時領先排行榜簡潔橫幅 */
    .leader-ticker {
      flex: 0 0 26px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 6px;
      overflow: hidden;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .ticker-label {
      color: #94a3b8;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .ticker-label svg {
      width: 12px;
      height: 12px;
      stroke: var(--accent-gold);
    }

    .ticker-items {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
    }
    .ticker-items::-webkit-scrollbar {
      display: none;
    }

    .ticker-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #1e293b;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .ticker-badge.rank-1 {
      border-color: #f59e0b;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      font-weight: 800;
    }
    .ticker-badge.rank-2 {
      border-color: #94a3b8;
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.15);
      font-weight: 700;
    }
    .ticker-badge.rank-3 {
      border-color: #b45309;
      color: #f97316;
      background: rgba(180, 83, 9, 0.15);
      font-weight: 700;
    }

    /* 主網格：30 個學生按鈕 5欄 × 6列，嚴格無滾動條 */
    .grid-container {
      flex: 1 1 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 3px;
      padding: 3px;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 學生按鈕卡片 */
    .student-btn {
      position: relative;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1px;
      gap: 3px;
      box-sizing: border-box;
      cursor: pointer;
      overflow: hidden;
      touch-action: none;
      transition: border-color 0.15s, background-color 0.15s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }

    .student-btn:active {
      transform: scale(0.96);
    }

    /* 角落指示區：名次左上，狀態圖示右上，絕不佔用中央垂直空間 */
    .rank-tag {
      position: absolute;
      top: 2px;
      left: 2px;
      z-index: 2;
      font-size: 0.62rem;
      font-weight: 900;
      line-height: 1;
      color: var(--text-muted);
      border-radius: 3px;
      padding: 1px 3px;
      min-width: 12px;
      text-align: center;
      pointer-events: none;
    }

    .rank-tag.p1 {
      color: #000;
      background: var(--accent-gold);
      font-weight: 900;
    }
    .rank-tag.p2 {
      color: #000;
      background: #cbd5e1;
      font-weight: 900;
    }
    .rank-tag.p3 {
      color: #fff;
      background: #b45309;
      font-weight: 900;
    }
    .rank-tag.top-ten {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
    }

    .status-icon {
      position: absolute;
      top: 2px;
      right: 2px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      line-height: 1;
      pointer-events: none;
    }

    .status-icon svg {
      width: 13px;
      height: 13px;
    }

    /* 中央巨大學生號碼：依比例最大化 */
    .id-number {
      font-size: clamp(1.45rem, 6.2vw, 2.3rem);
      font-weight: 900;
      color: #f1f5f9;
      line-height: 0.95;
      letter-spacing: -1px;
      margin: 0;
      white-space: nowrap;
    }

    /* 底部圈數進度資訊：依比例最大化 */
    .lap-info {
      display: inline-flex;
      justify-content: center;
      align-items: baseline;
      line-height: 1;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      white-space: nowrap;
    }

    .current-lap {
      font-size: clamp(1.05rem, 4.6vw, 1.6rem);
      font-weight: 900;
      color: #94a3b8;
      line-height: 1;
    }

    .total-lap-sub {
      font-size: clamp(0.58rem, 2.3vw, 0.8rem);
      font-weight: 700;
      color: #475569;
      line-height: 1;
      margin-left: 1px;
    }

    /* 各種狀態樣式 */
    /* 1. 進行中 (已跑但未到最後一圈) */
    .student-btn.in-progress {
      border-color: #2563eb;
      background: #0f1e38;
    }
    .student-btn.in-progress .id-number {
      color: #60a5fa;
    }
    .student-btn.in-progress .lap-info {
      background: rgba(37, 99, 235, 0.15);
    }
    .student-btn.in-progress .current-lap {
      color: #93c5fd;
    }

    /* 2. 最後一圈！特別醒目，光芒閃爍 */
    .student-btn.bell-lap {
      border-color: var(--accent-amber);
      background: #2b1803;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.45) inset;
      animation: pulse-bell 1.4s infinite ease-in-out;
    }
    .student-btn.bell-lap .id-number {
      color: #fef08a;
      text-shadow: 0 0 8px rgba(254, 240, 138, 0.6);
    }
    .student-btn.bell-lap .lap-info {
      background: rgba(245, 158, 11, 0.2);
    }
    .student-btn.bell-lap .current-lap {
      color: #fde047;
      font-weight: 900;
    }
    .student-btn.bell-lap .status-icon svg {
      stroke: #facc15;
      fill: #facc15;
      animation: swing 0.7s infinite alternate ease-in-out;
    }

    /* 3. 完賽 FINISH */
    .student-btn.finished {
      border-color: var(--accent-emerald);
      background: #062b1e;
    }
    .student-btn.finished .id-number {
      color: #6ee7b7;
    }
    .student-btn.finished .lap-info {
      background: rgba(16, 185, 129, 0.18);
    }
    .student-btn.finished .current-lap {
      color: #34d399;
    }
    .student-btn.finished .status-icon svg {
      stroke: #34d399;
      fill: none;
    }

    /* 長按視覺反饋指示器 (底線填充) */
    .longpress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: var(--accent-red);
      transition: width 0.05s linear;
      pointer-events: none;
    }

    /* 動畫 */
    @keyframes pulse-bell {
      0%, 100% {
        border-color: #f59e0b;
        box-shadow: 0 0 6px rgba(245, 158, 11, 0.3) inset;
      }
      50% {
        border-color: #ef4444;
        box-shadow: 0 0 14px rgba(239, 68, 68, 0.7) inset, 0 0 6px rgba(239, 68, 68, 0.5);
      }
    }

    @keyframes swing {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(15deg); }
    }

    /* 浮動名次總覽抽屜 (若裁判想看完整 1~30 名單，直接滑動遮罩查看) */
    .leader-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 10px) 12px;
    }
    .leader-modal.show {
      display: flex;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid #334155;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .close-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rank-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .rank-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
    }
    .rank-pos {
      font-weight: 900;
      font-size: 0.95rem;
      width: 28px;
    }
    .rank-pos.c1 { color: #f59e0b; }
    .rank-pos.c2 { color: #cbd5e1; }
    .rank-pos.c3 { color: #ea580c; }
    .rank-bib {
      font-weight: 800;
      font-size: 1.1rem;
      color: #f1f5f9;
    }
    .rank-lap-badge {
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 頂部列 -->
    <header>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="url(#logoG)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="logoG" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        <span class="brand-title">GHJH SPORT</span>
      </div>

      <div class="top-actions">
        <!-- 總圈數設定 (預設 8 圈) -->
        <div class="lap-setting-pill" id="lapPill">
          <button class="lap-step-btn" id="btnLapMinus" aria-label="減少總圈數">
            <svg viewBox="0 0 24 24" fill="none"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span id="targetLapsDisplay">🏁 8</span>
          <button class="lap-step-btn" id="btnLapPlus" aria-label="增加總圈數">
            <svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>

        <!-- 完整名次表開關 -->
        <button class="icon-btn" id="btnViewLeaderboard" aria-label="名次總覽">
          <svg viewBox="0 0 24 24"><path d="M6 9H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2M18 9h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21 1.18.54 2.03 2.03 2.03 3.79M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        </button>

        <!-- 復原按鈕 (Undo) -->
        <button class="icon-btn" id="btnUndo" disabled aria-label="復原">
          <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
        </button>

        <!-- 長按重設按鈕 (避免誤觸，長按 1.2 秒重置) -->
        <button class="icon-btn reset-btn" id="btnReset" aria-label="重設">
          <div class="reset-progress" id="resetProgress"></div>
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
      </div>
    </header>

    <!-- 即時領先榜滾動橫條 -->
    <div class="leader-ticker">
      <div class="ticker-label">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        TOP
      </div>
      <div class="ticker-items" id="tickerItems">
        <span style="color:#475569; font-size:0.75rem;">-</span>
      </div>
    </div>

    <!-- 30 個按鈕網格 (5 欄 × 6 列) -->
    <main class="grid-container" id="gridContainer">
      <!-- 由 JS 動態生成 30 個學生按鈕 -->
    </main>
  </div>

  <!-- 浮動名次總覽抽屜 -->
  <div class="leader-modal" id="leaderModal">
    <div class="modal-head">
      <div class="modal-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        RANK
      </div>
      <button class="close-btn" id="btnCloseModal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="rank-list-scroll" id="rankListScroll">
      <!-- 名次詳細列表 -->
    </div>
  </div>

  <script>
    (function() {
      // 狀態變數
      const TOTAL_STUDENTS = 30;
      let targetLaps = 8;
      
      // 學生資料：{ id, laps, lastLapTime, finishRank }
      let students = Array.from({ length: TOTAL_STUDENTS }, (_, i) => ({
        id: i + 1,
        laps: 0,
        lastLapTime: 0,
        finishRank: null
      }));

      // 操作歷史 (支援連續 Undo)
      const historyStack = [];

      // DOM 元素
      const gridContainer = document.getElementById('gridContainer');
      const targetLapsDisplay = document.getElementById('targetLapsDisplay');
      const btnLapMinus = document.getElementById('btnLapMinus');
      const btnLapPlus = document.getElementById('btnLapPlus');
      const btnUndo = document.getElementById('btnUndo');
      const btnReset = document.getElementById('btnReset');
      const resetProgress = document.getElementById('resetProgress');
      const tickerItems = document.getElementById('tickerItems');
      const btnViewLeaderboard = document.getElementById('btnViewLeaderboard');
      const leaderModal = document.getElementById('leaderModal');
      const btnCloseModal = document.getElementById('btnCloseModal');
      const rankListScroll = document.getElementById('rankListScroll');

      // 初始化按鈕 DOM
      function createGridButtons() {
        gridContainer.innerHTML = '';
        for (let i = 1; i <= TOTAL_STUDENTS; i++) {
          const btn = document.createElement('div');
          btn.className = 'student-btn';
          btn.id = `btn-student-${i}`;
          btn.setAttribute('data-id', i);
          
          btn.innerHTML = `
            <span class="rank-tag" id="rank-tag-${i}"></span>
            <span class="status-icon" id="status-icon-${i}"></span>
            <div class="id-number">${i < 10 ? '0' + i : i}</div>
            <div class="lap-info">
              <span class="current-lap" id="lap-num-${i}">0</span>
              <span class="total-lap-sub">/${targetLaps}</span>
            </div>
            <div class="longpress-bar" id="lp-bar-${i}"></div>
          `;
          
          attachButtonEvents(btn, i);
          gridContainer.appendChild(btn);
        }
      }

      // 觸控與長按/短按邏輯 (長按減圈、短按加圈，含防手震容差)
      function attachButtonEvents(btn, studentId) {
        let pressTimer = null;
        let isLongPress = false;
        let startTimestamp = 0;
        let startX = 0;
        let startY = 0;
        let animationFrame = null;
        const LONG_PRESS_DURATION = 400; // 400毫秒長按觸發
        const MOVE_TOLERANCE = 12; // 移動超過12px才視為取消
        const lpBar = btn.querySelector('.longpress-bar');

        function startPress(e) {
          isLongPress = false;
          startTimestamp = Date.now();
          startX = e.clientX || 0;
          startY = e.clientY || 0;

          try {
            if (e.pointerId !== undefined) {
              btn.setPointerCapture(e.pointerId);
            }
          } catch (_) {}

          function animateBar() {
            const elapsed = Date.now() - startTimestamp;
            const progress = Math.min(100, (elapsed / LONG_PRESS_DURATION) * 100);
            if (lpBar) lpBar.style.width = progress + '%';
            if (progress < 100 && !isLongPress) {
              animationFrame = requestAnimationFrame(animateBar);
            }
          }
          animationFrame = requestAnimationFrame(animateBar);

          pressTimer = setTimeout(() => {
            isLongPress = true;
            cancelAnimationFrame(animationFrame);
            if (lpBar) lpBar.style.width = '0%';
            
            // 觸發長按減圈
            handleLapChange(studentId, -1);
            
            if (navigator.vibrate) {
              try { navigator.vibrate(50); } catch (_) {}
            }
          }, LONG_PRESS_DURATION);
        }

        function movePress(e) {
          if (!startTimestamp) return;
          const currentX = e.clientX || 0;
          const currentY = e.clientY || 0;
          const dist = Math.hypot(currentX - startX, currentY - startY);
          if (dist > MOVE_TOLERANCE) {
            cancelPress(e);
          }
        }

        function endPress(e) {
          clearTimeout(pressTimer);
          cancelAnimationFrame(animationFrame);
          if (lpBar) lpBar.style.width = '0%';

          try {
            if (e && e.pointerId !== undefined && btn.hasPointerCapture(e.pointerId)) {
              btn.releasePointerCapture(e.pointerId);
            }
          } catch (_) {}

          if (!isLongPress && startTimestamp > 0 && (Date.now() - startTimestamp) < LONG_PRESS_DURATION) {
            // 短按加圈
            handleLapChange(studentId, +1);
          }
          startTimestamp = 0;
          isLongPress = false;
        }

        function cancelPress(e) {
          clearTimeout(pressTimer);
          cancelAnimationFrame(animationFrame);
          if (lpBar) lpBar.style.width = '0%';

          try {
            if (e && e.pointerId !== undefined && btn.hasPointerCapture(e.pointerId)) {
              btn.releasePointerCapture(e.pointerId);
            }
          } catch (_) {}

          startTimestamp = 0;
          isLongPress = false;
        }

        // Pointer 事件統一處理觸控與滑鼠
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          startPress(e);
        });

        btn.addEventListener('pointermove', movePress);

        btn.addEventListener('pointerup', (e) => {
          e.preventDefault();
          endPress(e);
        });

        btn.addEventListener('pointerleave', cancelPress);
        btn.addEventListener('pointercancel', cancelPress);

        // 避免長按跳出瀏覽器右鍵選單
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      }

      // 圈數變更處理
      function handleLapChange(studentId, delta) {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const prevLaps = student.laps;
        const prevTime = student.lastLapTime;

        // 計算新圈數
        let newLaps = prevLaps + delta;
        if (newLaps < 0) newLaps = 0;
        if (newLaps > targetLaps) return; // 已達到總圈數則不可再加

        if (newLaps === prevLaps) return;

        // 記錄歷史 (用於 Undo)
        historyStack.push({
          studentId,
          prevLaps,
          prevTime,
          newLaps
        });
        updateUndoButton();

        // 更新學生狀態
        student.laps = newLaps;
        student.lastLapTime = newLaps > 0 ? Date.now() : 0;

        updateAllUI();
      }

      // 復原最後一步操作
      function undoLastAction() {
        if (historyStack.length === 0) return;
        const lastAction = historyStack.pop();
        const student = students.find(s => s.id === lastAction.studentId);
        if (student) {
          student.laps = lastAction.prevLaps;
          student.lastLapTime = lastAction.prevTime;
        }
        updateUndoButton();
        updateAllUI();
      }

      function updateUndoButton() {
        btnUndo.disabled = historyStack.length === 0;
        if (historyStack.length > 0) {
          btnUndo.classList.add('active-amber');
        } else {
          btnUndo.classList.remove('active-amber');
        }
      }

      // 計算各學生排名
      // 規則：圈數多者在前；若圈數相同，以先達到該圈數的時間戳早者在前；0 圈依編號排序
      function calculateRankings() {
        const ranked = [...students].sort((a, b) => {
          if (b.laps !== a.laps) {
            return b.laps - a.laps;
          }
          if (a.laps > 0) {
            return a.lastLapTime - b.lastLapTime;
          }
          return a.id - b.id;
        });

        // 建立 id -> rank 映射
        const rankMap = new Map();
        let currentRank = 1;
        ranked.forEach((s) => {
          if (s.laps > 0) {
            rankMap.set(s.id, currentRank++);
          } else {
            rankMap.set(s.id, null);
          }
        });

        return { rankedList: ranked, rankMap };
      }

      // 刷新所有 UI
      function updateAllUI() {
        const { rankedList, rankMap } = calculateRankings();

        // 1. 更新 30 個按鈕狀態
        students.forEach(student => {
          const btn = document.getElementById(`btn-student-${student.id}`);
          if (!btn) return;

          const lapDisplay = document.getElementById(`lap-num-${student.id}`);
          const rankTag = document.getElementById(`rank-tag-${student.id}`);
          const statusIcon = document.getElementById(`status-icon-${student.id}`);

          lapDisplay.textContent = student.laps;

          // 清除舊狀態 class
          btn.classList.remove('in-progress', 'bell-lap', 'finished');

          const rank = rankMap.get(student.id);
          if (rank !== null && rank !== undefined) {
            rankTag.textContent = `#${rank}`;
            rankTag.className = 'rank-tag';
            if (rank === 1) rankTag.classList.add('p1');
            else if (rank === 2) rankTag.classList.add('p2');
            else if (rank === 3) rankTag.classList.add('p3');
            else if (rank <= 10) rankTag.classList.add('top-ten');
          } else {
            rankTag.textContent = '';
            rankTag.className = 'rank-tag';
          }

          // 圈數狀態判定
          if (student.laps >= targetLaps) {
            // 完賽
            btn.classList.add('finished');
            statusIcon.innerHTML = `
              <svg viewBox="0 0 24 24">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
              </svg>
            `;
          } else if (student.laps === targetLaps - 1 && targetLaps > 1) {
            // 最後一圈！特別提醒
            btn.classList.add('bell-lap');
            statusIcon.innerHTML = `
              <svg viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            `;
          } else if (student.laps > 0) {
            // 進行中
            btn.classList.add('in-progress');
            statusIcon.innerHTML = '';
          } else {
            // 0 圈
            statusIcon.innerHTML = '';
          }
        });

        // 2. 更新頂部即時領先榜 (Ticker)
        updateTicker(rankedList);

        // 3. 更新浮動名次表 (如果開著)
        if (leaderModal.classList.contains('show')) {
          renderLeaderboard(rankedList, rankMap);
        }
      }

      // 更新頂部領先跑馬條
      function updateTicker(rankedList) {
        const activeRunners = rankedList.filter(s => s.laps > 0);
        if (activeRunners.length === 0) {
          tickerItems.innerHTML = '<span style="color:#475569; font-size:0.75rem;">-</span>';
          return;
        }

        let html = '';
        activeRunners.slice(0, 10).forEach((s, idx) => {
          const rankNum = idx + 1;
          let rankClass = '';
          if (rankNum === 1) rankClass = 'rank-1';
          else if (rankNum === 2) rankClass = 'rank-2';
          else if (rankNum === 3) rankClass = 'rank-3';

          const isFinished = s.laps >= targetLaps;
          const isBell = s.laps === targetLaps - 1;
          const icon = isFinished ? '🏁' : (isBell ? '🔔' : '');

          html += `
            <div class="ticker-badge ${rankClass}">
              <span>#${rankNum}</span>
              <strong>${s.id < 10 ? '0' + s.id : s.id}</strong>
              <span>${s.laps}/${targetLaps}${icon}</span>
            </div>
          `;
        });
        tickerItems.innerHTML = html;
      }

      // 渲染名次總覽抽屜
      function renderLeaderboard(rankedList, rankMap) {
        let html = '';
        rankedList.forEach(s => {
          const rank = rankMap.get(s.id);
          const rankText = rank ? `${rank}` : '-';
          let posColor = '';
          if (rank === 1) posColor = 'c1';
          else if (rank === 2) posColor = 'c2';
          else if (rank === 3) posColor = 'c3';

          const isFinished = s.laps >= targetLaps;
          const isBell = s.laps === targetLaps - 1;
          const statusText = isFinished ? '🏁' : (isBell ? '🔔' : `${s.laps}/${targetLaps}`);

          html += `
            <div class="rank-card-row">
              <span class="rank-pos ${posColor}">${rankText}</span>
              <span class="rank-bib">${s.id < 10 ? '0' + s.id : s.id}</span>
              <span class="rank-lap-badge">${statusText}</span>
            </div>
          `;
        });
        rankListScroll.innerHTML = html;
      }

      // 總圈數切換事件
      btnLapMinus.addEventListener('click', () => {
        if (targetLaps > 1) {
          targetLaps--;
          applyTargetLaps();
        }
      });

      btnLapPlus.addEventListener('click', () => {
        if (targetLaps < 8) {
          targetLaps++;
          applyTargetLaps();
        }
      });

      function applyTargetLaps() {
        targetLapsDisplay.textContent = `🏁 ${targetLaps}`;
        students.forEach(s => {
          if (s.laps > targetLaps) {
            s.laps = targetLaps;
          }
        });
        // 更新所有按鈕底部的總圈數顯示
        for (let i = 1; i <= TOTAL_STUDENTS; i++) {
          const sub = document.querySelector(`#btn-student-${i} .total-lap-sub`);
          if (sub) sub.textContent = `/${targetLaps}`;
        }
        updateAllUI();
      }

      // 復原按鈕點擊
      btnUndo.addEventListener('click', () => {
        undoLastAction();
      });

      // 長按重設按鈕 (避免誤觸，需長按 1.2 秒，絕無任何彈窗)
      let resetTimer = null;
      let resetStartTime = 0;
      let resetAnimFrame = null;
      const RESET_HOLD_TIME = 1200;

      function startResetHold(e) {
        e.preventDefault();
        resetStartTime = Date.now();

        function animReset() {
          const elapsed = Date.now() - resetStartTime;
          const pct = Math.min(100, (elapsed / RESET_HOLD_TIME) * 100);
          resetProgress.style.width = pct + '%';
          if (pct < 100) {
            resetAnimFrame = requestAnimationFrame(animReset);
          }
        }
        resetAnimFrame = requestAnimationFrame(animReset);

        resetTimer = setTimeout(() => {
          cancelAnimationFrame(resetAnimFrame);
          resetProgress.style.width = '0%';
          executeFullReset();
          if (navigator.vibrate) {
            try { navigator.vibrate([80, 50, 80]); } catch (_) {}
          }
        }, RESET_HOLD_TIME);
      }

      function cancelResetHold() {
        clearTimeout(resetTimer);
        cancelAnimationFrame(resetAnimFrame);
        resetProgress.style.width = '0%';
      }

      function executeFullReset() {
        students.forEach(s => {
          s.laps = 0;
          s.lastLapTime = 0;
          s.finishRank = null;
        });
        historyStack.length = 0;
        updateUndoButton();
        updateAllUI();
      }

      btnReset.addEventListener('pointerdown', startResetHold);
      btnReset.addEventListener('pointerup', cancelResetHold);
      btnReset.addEventListener('pointerleave', cancelResetHold);
      btnReset.addEventListener('pointercancel', cancelResetHold);
      btnReset.addEventListener('contextmenu', (e) => e.preventDefault());

      // 名次總覽彈窗切換
      btnViewLeaderboard.addEventListener('click', () => {
        const { rankedList, rankMap } = calculateRankings();
        renderLeaderboard(rankedList, rankMap);
        leaderModal.classList.add('show');
      });

      btnCloseModal.addEventListener('click', () => {
        leaderModal.classList.remove('show');
      });

      // 啟動初始化
      createGridButtons();
      updateAllUI();

      // 防止 iOS 彈性滾動造成畫面晃動
      document.body.addEventListener('touchmove', function(e) {
        if (!e.target.closest('.rank-list-scroll')) {
          e.preventDefault();
        }
      }, { passive: false });

    })();
  </script>
