<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GHJH SPORT</title>
  <style>
/* ========================================================
   GHJH SPORT - 徑賽圈數與名次計數系統 (手機深色模式專用)
   ======================================================== */

:root {
  --bg-primary: #0a0f1d;
  --bg-secondary: #111827;
  --bg-card: #1e293b;
  --bg-card-hover: #283548;
  
  --border-color: #334155;
  --border-light: #475569;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  /* 狀態顏色 */
  --accent-cyan: #38bdf8;
  --accent-blue: #2563eb;
  
  /* 最後一圈 (警示琥珀金) */
  --final-lap-bg: rgba(245, 158, 11, 0.22);
  --final-lap-border: #f59e0b;
  --final-lap-text: #fef08a;
  --final-lap-glow: rgba(245, 158, 11, 0.4);

  /* 完賽 (活力綠) */
  --finished-bg: rgba(16, 185, 129, 0.22);
  --finished-border: #10b981;
  --finished-text: #a7f3d0;

  /* 領先/第一名 */
  --gold: #fbbf24;
  --silver: #cbd5e1;
  --bronze: #f97316;

  /* 系統字體 */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}

/* 全域重置 */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden; /* 確保不需滑動畫面即可看到所有編號按鈕 */
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-family);
  line-height: 1.2;
}

/* 所有按鈕與文字均不換行 (嚴格符合需求) */
button, 
.control-btn, 
.bib-btn, 
.btn-text, 
.alert-tag, 
.leader-tag, 
.action-tag,
.selector-label, 
.panel-summary {
  white-space: nowrap !important;
  text-overflow: ellipsis;
}

/* 主容器 */
.app-container {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100dvh;
  max-width: 600px; /* 適用常見手機寬度 */
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background-color: var(--bg-primary);
}

/* 頂部控制面板 */
.top-bar {
  flex-shrink: 0;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 20;
}

.header-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.logo-badge {
  background: linear-gradient(135deg, #ef4444, #f97316);
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.logo-title {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 0.5px;
  background: linear-gradient(90deg, #ffffff, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 總圈數選擇器 */
.laps-selector-wrapper {
  display: flex;
  align-items: center;
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 2px 4px;
  font-size: 12px;
}

.selector-label {
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  margin-right: 2px;
}

.total-laps-select {
  background: transparent;
  border: none;
  color: var(--accent-cyan);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  outline: none;
  padding: 2px 0;
}

.total-laps-select option {
  background-color: var(--bg-secondary);
  color: var(--text-primary);
}

/* 控制按鈕共同樣式 */
.control-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--border-color);
  background-color: var(--bg-card);
  color: var(--text-primary);
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.15s ease;
}

.control-btn:active {
  transform: scale(0.95);
}

.control-btn .btn-icon {
  font-size: 13px;
}

/* 復原按鈕 */
.undo-btn {
  background-color: rgba(56, 189, 248, 0.1);
  border-color: rgba(56, 189, 248, 0.4);
  color: var(--accent-cyan);
}

.undo-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  border-color: var(--border-color);
  color: var(--text-muted);
}

/* 重設按鈕 (內聯兩階段防呆確認，無彈窗) */
.reset-btn {
  background-color: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.35);
  color: #fca5a5;
}

.reset-btn.confirming {
  background-color: #ef4444;
  border-color: #dc2626;
  color: #ffffff;
  animation: pulse-danger 0.8s infinite alternate;
}

@keyframes pulse-danger {
  0% { transform: scale(1); }
  100% { transform: scale(1.05); }
}

/* 名次榜切換按鈕 */
.toggle-view-btn {
  background-color: rgba(251, 191, 36, 0.12);
  border-color: rgba(251, 191, 36, 0.4);
  color: var(--gold);
}

/* 即時資訊跑馬燈條 */
.status-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  background-color: rgba(15, 23, 42, 0.8);
  border-radius: 6px;
  padding: 4px 8px;
  min-height: 28px;
  font-size: 12px;
  overflow: hidden;
}

.banner-item {
  display: flex;
  align-items: center;
  gap: 5px;
  overflow: hidden;
  white-space: nowrap;
}

/* 剩最後一圈提醒專區 (高對比琥珀黃) */
.final-lap-alert {
  background: var(--final-lap-bg);
  border: 1px solid var(--final-lap-border);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--final-lap-text);
  font-weight: 800;
  animation: pulse-alert 1.2s infinite ease-in-out;
}

@keyframes pulse-alert {
  0%, 100% { box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
  50% { box-shadow: 0 0 8px var(--final-lap-glow); }
}

.alert-tag {
  color: #fbbf24;
  font-weight: 900;
}

.alert-list {
  color: #fffbeb;
  font-weight: 800;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.leader-tag {
  color: var(--gold);
  font-weight: 800;
  font-size: 11px;
}

.leader-list {
  color: var(--text-primary);
  font-weight: 700;
  font-size: 12px;
}

.last-action-info {
  margin-left: auto;
  color: var(--text-muted);
  font-size: 11px;
  flex-shrink: 0;
}

.action-tag {
  background: #334155;
  color: #cbd5e1;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 10px;
  margin-right: 3px;
}

/* ========================================================
   按鈕網格區：30 個按鈕免滑動全螢幕配置
   5 欄 x 6 列 = 30 個學生按鈕
   ======================================================== */
.grid-container {
  flex: 1;
  min-height: 0; /* 關鍵：防止 flex 子元件撐破螢幕引發滾動 */
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 4px;
  padding: 4px;
  width: 100%;
  height: 100%;
  background-color: var(--bg-primary);
  box-sizing: border-box;
}

/* 學生號碼衣服按鈕 */
.bib-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background-color: var(--bg-card);
  border: 1.5px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  cursor: pointer;
  touch-action: manipulation;
  overflow: hidden;
  transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.15s ease;
  min-width: 0;
  min-height: 0;
  padding: 2px;
}

/* 長按時的進度填滿覆蓋條 (視覺回饋，無彈窗、無音效) */
.bib-btn .press-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0%;
  height: 100%;
  background: rgba(239, 68, 68, 0.4);
  pointer-events: none;
  transition: width 0.45s linear;
  z-index: 1;
}

.bib-btn.pressing .press-progress {
  width: 100%;
}

.bib-btn:active {
  transform: scale(0.94);
}

/* 學生號碼：大字體、高對比 */
.bib-number {
  font-size: clamp(17px, 4.8vw, 24px);
  font-weight: 900;
  color: #ffffff;
  line-height: 1;
  margin-bottom: 2px;
  letter-spacing: -0.5px;
  z-index: 2;
  white-space: nowrap !important;
}

/* 圈數顯示：例如 "3/8圈" */
.bib-laps {
  font-size: clamp(10px, 2.7vw, 13px);
  font-weight: 700;
  color: var(--text-secondary);
  line-height: 1;
  margin-bottom: 2px;
  z-index: 2;
  white-space: nowrap !important;
}

/* 名次/狀態徽章 */
.bib-status {
  font-size: clamp(9px, 2.4vw, 11px);
  font-weight: 800;
  line-height: 1;
  padding: 1px 3px;
  border-radius: 3px;
  background-color: rgba(15, 23, 42, 0.7);
  color: var(--text-muted);
  z-index: 2;
  white-space: nowrap !important;
}

/* 進行中狀態 (已有圈數) */
.bib-btn.running {
  border-color: rgba(56, 189, 248, 0.5);
  background-color: #172554;
}

.bib-btn.running .bib-number {
  color: #ffffff;
}

.bib-btn.running .bib-laps {
  color: var(--accent-cyan);
}

.bib-btn.running .bib-status {
  color: #93c5fd;
  background-color: rgba(30, 58, 138, 0.8);
}

/* 前三名特別顏色徽章 */
.bib-btn.rank-1 .bib-status {
  background-color: var(--gold);
  color: #000000;
}
.bib-btn.rank-2 .bib-status {
  background-color: var(--silver);
  color: #000000;
}
.bib-btn.rank-3 .bib-status {
  background-color: var(--bronze);
  color: #ffffff;
}

/* 剩最後一圈提醒狀態 (琥珀金高亮 + 醒目標示) */
.bib-btn.final-lap {
  background-color: var(--final-lap-bg) !important;
  border-color: var(--final-lap-border) !important;
  border-width: 2px !important;
}

.bib-btn.final-lap .bib-number {
  color: #ffffff;
}

.bib-btn.final-lap .bib-laps {
  color: var(--final-lap-text);
  font-weight: 900;
}

.bib-btn.final-lap .bib-status {
  background-color: #f59e0b;
  color: #000000;
  font-weight: 900;
}

/* 完賽狀態 (翡翠綠高亮 + 鎖定名次) */
.bib-btn.finished {
  background-color: var(--finished-bg) !important;
  border-color: var(--finished-border) !important;
  opacity: 0.92;
}

.bib-btn.finished .bib-number {
  color: #ffffff;
}

.bib-btn.finished .bib-laps {
  color: var(--finished-text);
}

.bib-btn.finished .bib-status {
  background-color: #10b981;
  color: #000000;
  font-weight: 900;
}

/* 點擊瞬間微動畫 */
@keyframes tap-flash {
  0% { transform: scale(1.08); filter: brightness(1.4); }
  100% { transform: scale(1); filter: brightness(1); }
}

.bib-btn.just-updated {
  animation: tap-flash 0.22s ease-out;
}

/* ========================================================
   名次榜抽屜面板 (可快速展開供老師謄寫全體排名)
   ======================================================== */
.leaderboard-panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(10, 15, 29, 0.98);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 50;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}

.leaderboard-panel.active {
  transform: translateY(0);
}

.panel-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
}

.panel-title-area {
  display: flex;
  align-items: center;
  gap: 6px;
}

.panel-title-icon {
  font-size: 18px;
}

.panel-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--gold);
}

.panel-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-summary {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 600;
}

.close-panel-btn {
  background-color: #334155;
  color: #ffffff;
  padding: 5px 10px;
  font-size: 12px;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* 名次項目卡片 */
.rank-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

.rank-card.top-1 { border-color: var(--gold); background: rgba(251, 191, 36, 0.12); }
.rank-card.top-2 { border-color: var(--silver); background: rgba(203, 213, 225, 0.1); }
.rank-card.top-3 { border-color: var(--bronze); background: rgba(249, 115, 22, 0.1); }

.rank-card-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.rank-order {
  font-size: 15px;
  font-weight: 900;
  width: 32px;
  text-align: center;
  color: var(--text-secondary);
}

.rank-card.top-1 .rank-order { color: var(--gold); }
.rank-card.top-2 .rank-order { color: var(--silver); }
.rank-card.top-3 .rank-order { color: var(--bronze); }

.rank-bib-name {
  font-size: 17px;
  font-weight: 800;
  color: #ffffff;
}

.rank-card-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rank-lap-badge {
  font-size: 13px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  background-color: rgba(56, 189, 248, 0.15);
  color: var(--accent-cyan);
}

.rank-status-badge {
  font-size: 12px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 4px;
  background-color: #334155;
  color: #cbd5e1;
}

.rank-status-badge.final-lap {
  background-color: #f59e0b;
  color: #000000;
}

.rank-status-badge.finished {
  background-color: #10b981;
  color: #000000;
}

/* 極窄或極小螢幕優化 (iPhone SE 568px / 667px 高度等) */
@media (max-height: 670px) {
  .top-bar {
    padding: 3px 6px;
    gap: 2px;
  }
  .logo-title {
    font-size: 15px;
  }
  .control-btn {
    padding: 3px 6px;
    font-size: 11px;
  }
  .status-banner {
    min-height: 24px;
    padding: 2px 6px;
    font-size: 11px;
  }
  .grid-container {
    gap: 2px;
    padding: 2px;
  }
  .bib-btn {
    border-radius: 5px;
    padding: 1px;
  }
}
  </style>
</head>
<body>
  <div id="app" class="app-container">
    <!-- 頂部控制與資訊欄 -->
    <header class="top-bar">
      <div class="header-main">
        <div class="logo-area">
          <span class="logo-badge">徑賽</span>
          <h1 class="logo-title">GHJH SPORT</h1>
        </div>

        <div class="header-actions">
          <!-- 總圈數選擇 (至多 8 圈) -->
          <div class="laps-selector-wrapper">
            <label for="totalLapsSelect" class="selector-label">總圈數</label>
            <select id="totalLapsSelect" class="total-laps-select">
              <option value="1">1 圈</option>
              <option value="2">2 圈</option>
              <option value="3">3 圈</option>
              <option value="4">4 圈</option>
              <option value="5">5 圈</option>
              <option value="6">6 圈</option>
              <option value="7">7 圈</option>
              <option value="8" selected>8 圈</option>
            </select>
          </div>

          <!-- 復原按鈕 (避免重複及錯誤點擊) -->
          <button id="undoBtn" class="control-btn undo-btn" disabled title="復原上一次點擊">
            <span class="btn-icon">↩</span>
            <span class="btn-text">復原</span>
          </button>

          <!-- 重設按鈕 (內聯兩階段確認，無彈窗) -->
          <button id="resetBtn" class="control-btn reset-btn" title="重設所有資料">
            <span class="btn-icon">↺</span>
            <span class="btn-text" id="resetBtnText">重設</span>
          </button>

          <!-- 排名榜切換按鈕 -->
          <button id="viewToggleBtn" class="control-btn toggle-view-btn" title="查看名次榜">
            <span class="btn-icon">🏆</span>
            <span class="btn-text" id="viewToggleText">名次</span>
          </button>
        </div>
      </div>

      <!-- 即時警示與狀態條 (無音效、無語音、無彈窗，但極為醒目) -->
      <div class="status-banner" id="statusBanner">
        <div class="banner-item final-lap-alert" id="finalLapAlert" style="display: none;">
          <span class="alert-tag">⚠️ 剩最後一圈</span>
          <span class="alert-list" id="finalLapList">無</span>
        </div>
        <div class="banner-item race-leader-info" id="raceLeaderInfo">
          <span class="leader-tag">👑 目前領先</span>
          <span class="leader-list" id="raceLeaderList">比賽尚未開始</span>
        </div>
        <div class="banner-item last-action-info" id="lastActionInfo">
          <span class="action-tag">操作方式</span>
          <span class="action-desc">短按+1圈｜長按-1圈</span>
        </div>
      </div>
    </header>

    <!-- 主內容區：30 個學生號碼按鈕網格 (5x6 配置，免滑動填滿螢幕) -->
    <main class="grid-container" id="gridContainer">
      <!-- 由 JavaScript 自動產生 01 ~ 30 號按鈕 -->
    </main>

    <!-- 名次榜抽屜面板 (非彈窗，可收合展開，方便老師謄寫最終成績) -->
    <section class="leaderboard-panel" id="leaderboardPanel">
      <div class="panel-header">
        <div class="panel-title-area">
          <span class="panel-title-icon">🏆</span>
          <h2 class="panel-title">即時名次榜</h2>
        </div>
        <div class="panel-header-actions">
          <span class="panel-summary" id="panelSummary">已完賽: 0 / 30 人</span>
          <button id="closeLeaderboardBtn" class="control-btn close-panel-btn">返回按鈕網格</button>
        </div>
      </div>
      <div class="panel-body" id="leaderboardList">
        <!-- 名次清單項目由 JS 動態生成 -->
      </div>
    </section>
  </div>

  <script>
/**
 * GHJH SPORT - 徑賽圈數與名次計數系統
 * 專為手機端設計，深色模式，免伺服器，無彈窗，防誤觸
 */
(() => {
  'use strict';

  // 系統常數
  const TOTAL_STUDENTS = 30;
  const LONG_PRESS_MS = 450; // 長按判定時間 (毫秒)
  const RESET_TIMEOUT_MS = 3000; // 重設確認倒數 (毫秒)
  const STORAGE_KEY = 'GHJH_SPORT_RACE_STATE_V1';

  // DOM 元素引用
  const gridContainer = document.getElementById('gridContainer');
  const totalLapsSelect = document.getElementById('totalLapsSelect');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resetBtnText = document.getElementById('resetBtnText');
  const viewToggleBtn = document.getElementById('viewToggleBtn');
  const viewToggleText = document.getElementById('viewToggleText');
  const leaderboardPanel = document.getElementById('leaderboardPanel');
  const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
  const leaderboardList = document.getElementById('leaderboardList');
  const panelSummary = document.getElementById('panelSummary');

  // 跑馬燈元素
  const finalLapAlert = document.getElementById('finalLapAlert');
  const finalLapList = document.getElementById('finalLapList');
  const raceLeaderInfo = document.getElementById('raceLeaderInfo');
  const raceLeaderList = document.getElementById('raceLeaderList');
  const lastActionInfo = document.getElementById('lastActionInfo');

  // 狀態變數
  let totalLaps = parseInt(totalLapsSelect.value, 10) || 8;
  let students = []; // 30位學生的資料
  let historyStack = []; // 復原操作堆疊
  let resetConfirmTimer = null; // 重設二階段確認計時器
  let isResetConfirming = false;

  /**
   * 初始化 30 位學生資料
   */
  function initStudents() {
    students = [];
    for (let i = 1; i <= TOTAL_STUDENTS; i++) {
      students.push({
        bib: i,
        bibStr: i < 10 ? `0${i}` : `${i}`,
        laps: 0,
        lastUpdated: 0, // 完成最近一圈的時間戳記
        finishTime: 0,  // 完賽時間戳記
        isFinished: false,
        rank: null
      });
    }
  }

  /**
   * 載入儲存的狀態 (避免誤關閉瀏覽器遺失資料)
   */
  function loadSavedState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data && Array.isArray(data.students) && data.students.length === TOTAL_STUDENTS) {
          students = data.students;
          totalLaps = data.totalLaps || 8;
          totalLapsSelect.value = totalLaps;
          historyStack = Array.isArray(data.historyStack) ? data.historyStack : [];
          return true;
        }
      }
    } catch (e) {
      console.warn('載入暫存紀錄失敗', e);
    }
    return false;
  }

  /**
   * 儲存當前狀態到 localStorage
   */
  function persistState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        students,
        totalLaps,
        historyStack
      }));
    } catch (e) {
      // 靜默處理
    }
  }

  /**
   * 計算並刷新全體名次順序
   */
  function calculateRankings() {
    // 排序邏輯：
    // 1. 完賽者優先，依完賽時間戳記 (finishTime) 升冪排序 (先衝線先得勝)
    // 2. 進行中者，依完成圈數 (laps) 降冪排序
    // 3. 圈數相同者，依達到該圈數的時間戳記 (lastUpdated) 升冪排序 (先完成該圈者領先)
    // 4. 0 圈者列於最後，依號碼牌升冪排序
    const sorted = [...students].sort((a, b) => {
      if (a.isFinished && b.isFinished) {
        return a.finishTime - b.finishTime;
      }
      if (a.isFinished) return -1;
      if (b.isFinished) return 1;

      if (b.laps !== a.laps) {
        return b.laps - a.laps;
      }

      if (a.laps > 0) {
        return a.lastUpdated - b.lastUpdated;
      }

      return a.bib - b.bib;
    });

    // 指派名次
    let currentRank = 1;
    sorted.forEach((student) => {
      if (student.laps > 0) {
        student.rank = currentRank++;
      } else {
        student.rank = null; // 尚未開始計圈
      }
    });

    const rankMap = new Map();
    students.forEach(s => rankMap.set(s.bib, s.rank));
    return rankMap;
  }

  /**
   * 增加圈數 (短按按鈕)
   * @param {number} bib - 學生號碼 (1-30)
   */
  function incrementLap(bib) {
    const student = students.find(s => s.bib === bib);
    if (!student) return;

    if (student.laps >= totalLaps) {
      // 已完賽，不再增加圈數
      flashButton(bib);
      return;
    }

    const now = Date.now();
    const prevLaps = student.laps;
    const prevLastUpdated = student.lastUpdated;
    const prevFinishTime = student.finishTime;
    const prevFinished = student.isFinished;

    student.laps += 1;
    student.lastUpdated = now;

    if (student.laps >= totalLaps) {
      student.isFinished = true;
      student.finishTime = now;
    }

    // 存入復原堆疊
    historyStack.push({
      action: 'increment',
      bib: bib,
      prevLaps,
      prevLastUpdated,
      prevFinishTime,
      prevFinished,
      newLap: student.laps,
      timeText: `${student.bibStr}號 +1圈(${student.laps}/${totalLaps})`
    });

    onRaceStateChanged(bib, `已記錄 ${student.bibStr}號 完成第${student.laps}圈`);
  }

  /**
   * 減少圈數 (長按按鈕)
   * @param {number} bib - 學生號碼 (1-30)
   */
  function decrementLap(bib) {
    const student = students.find(s => s.bib === bib);
    if (!student || student.laps <= 0) {
      flashButton(bib);
      return;
    }

    const prevLaps = student.laps;
    const prevLastUpdated = student.lastUpdated;
    const prevFinishTime = student.finishTime;
    const prevFinished = student.isFinished;

    student.laps -= 1;
    student.isFinished = false;
    student.finishTime = 0;
    student.lastUpdated = Date.now();

    // 存入復原堆疊
    historyStack.push({
      action: 'decrement',
      bib: bib,
      prevLaps,
      prevLastUpdated,
      prevFinishTime,
      prevFinished,
      newLap: student.laps,
      timeText: `${student.bibStr}號 -1圈(${student.laps}/${totalLaps})`
    });

    onRaceStateChanged(bib, `修正扣除 ${student.bibStr}號 1圈 (現為${student.laps}圈)`);
  }

  /**
   * 執行復原
   */
  function undoLastAction() {
    if (historyStack.length === 0) return;

    const lastAction = historyStack.pop();
    const student = students.find(s => s.bib === lastAction.bib);
    if (!student) return;

    student.laps = lastAction.prevLaps;
    student.lastUpdated = lastAction.prevLastUpdated;
    student.finishTime = lastAction.prevFinishTime;
    student.isFinished = lastAction.prevFinished;

    onRaceStateChanged(student.bib, `已復原 ${student.bibStr}號 上次操作`);
  }

  /**
   * 比賽狀態改變後的統一步驟
   */
  function onRaceStateChanged(updatedBib, logText) {
    calculateRankings();
    renderAllButtons();
    updateStatusBanners(logText);
    updateUndoButtonState();
    persistState();

    if (updatedBib) {
      flashButton(updatedBib);
    }
  }

  /**
   * 按鈕微動畫
   */
  function flashButton(bib) {
    const btn = document.getElementById(`bib-btn-${bib}`);
    if (btn) {
      btn.classList.remove('just-updated');
      void btn.offsetWidth;
      btn.classList.add('just-updated');
    }
  }

  /**
   * 更新復原按鈕狀態
   */
  function updateUndoButtonState() {
    if (historyStack.length > 0) {
      const topAction = historyStack[historyStack.length - 1];
      const bibStr = topAction.bib < 10 ? `0${topAction.bib}` : `${topAction.bib}`;
      undoBtn.disabled = false;
      undoBtn.querySelector('.btn-text').textContent = `復原(${bibStr}號)`;
    } else {
      undoBtn.disabled = true;
      undoBtn.querySelector('.btn-text').textContent = '復原';
    }
  }

  /**
   * 更新跑馬燈與最後一圈醒目提醒
   */
  function updateStatusBanners(logText) {
    if (logText) {
      lastActionInfo.querySelector('.action-desc').textContent = logText;
    }

    // 當 totalLaps > 1 時，完成了 totalLaps - 1 圈即代表進入最後一圈
    const finalLapRunners = students
      .filter(s => !s.isFinished && totalLaps > 1 && s.laps === totalLaps - 1)
      .map(s => `${s.bibStr}號`);

    if (finalLapRunners.length > 0) {
      finalLapAlert.style.display = 'flex';
      finalLapList.textContent = finalLapRunners.join('、');
      raceLeaderInfo.style.display = 'none';
    } else {
      finalLapAlert.style.display = 'none';
      raceLeaderInfo.style.display = 'flex';

      const leaders = students
        .filter(s => s.laps > 0)
        .sort((a, b) => (a.rank || 99) - (b.rank || 99))
        .slice(0, 2)
        .map(s => `${s.bibStr}號(${s.isFinished ? '完賽' : s.laps + '圈'})`);

      if (leaders.length > 0) {
        raceLeaderList.textContent = leaders.join(' ｜ ');
      } else {
        raceLeaderList.textContent = '比賽尚未開始';
      }
    }
  }

  /**
   * 建立 30 個學生按鈕
   */
  function buildButtonsGrid() {
    gridContainer.innerHTML = '';

    for (let i = 1; i <= TOTAL_STUDENTS; i++) {
      const btn = document.createElement('button');
      btn.className = 'bib-btn';
      btn.id = `bib-btn-${i}`;
      btn.setAttribute('data-bib', i);

      // 長按視覺倒退進度填滿條
      const progressOverlay = document.createElement('div');
      progressOverlay.className = 'press-progress';
      btn.appendChild(progressOverlay);

      // 號碼衣大字體
      const numSpan = document.createElement('span');
      numSpan.className = 'bib-number';
      numSpan.textContent = i < 10 ? `0${i}` : `${i}`;
      btn.appendChild(numSpan);

      // 圈數
      const lapsSpan = document.createElement('span');
      lapsSpan.className = 'bib-laps';
      lapsSpan.id = `bib-laps-${i}`;
      lapsSpan.textContent = `0/${totalLaps}圈`;
      btn.appendChild(lapsSpan);

      // 狀態與名次徽章
      const statusSpan = document.createElement('span');
      statusSpan.className = 'bib-status';
      statusSpan.id = `bib-status-${i}`;
      statusSpan.textContent = '準備';
      btn.appendChild(statusSpan);

      attachPressHandlers(btn, i);
      gridContainer.appendChild(btn);
    }
  }

  /**
   * 綁定短按(+1圈)與長按(-1圈)事件
   */
  function attachPressHandlers(element, bib) {
    let pressTimer = null;
    let isLongPressTriggered = false;
    let startX = 0;
    let startY = 0;

    element.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    const startPress = (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      isLongPressTriggered = false;
      startX = e.clientX;
      startY = e.clientY;

      element.classList.add('pressing');

      pressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        element.classList.remove('pressing');
        decrementLap(bib); // 長按扣減圈數
      }, LONG_PRESS_MS);
    };

    const cancelPress = () => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      element.classList.remove('pressing');
    };

    const endPress = (e) => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      element.classList.remove('pressing');

      if (!isLongPressTriggered) {
        incrementLap(bib); // 短按增加圈數
      }
      isLongPressTriggered = false;
    };

    const movePress = (e) => {
      const deltaX = Math.abs(e.clientX - startX);
      const deltaY = Math.abs(e.clientY - startY);
      if (deltaX > 12 || deltaY > 12) {
        cancelPress();
      }
    };

    element.addEventListener('pointerdown', startPress);
    element.addEventListener('pointerup', endPress);
    element.addEventListener('pointercancel', cancelPress);
    element.addEventListener('pointerleave', cancelPress);
    element.addEventListener('pointermove', movePress);
  }

  /**
   * 刷新所有 30 個按鈕狀態 (外觀、字體、圈數、名次、警告)
   */
  function renderAllButtons() {
    students.forEach(student => {
      const btn = document.getElementById(`bib-btn-${student.bib}`);
      if (!btn) return;

      const lapsSpan = document.getElementById(`bib-laps-${student.bib}`);
      const statusSpan = document.getElementById(`bib-status-${student.bib}`);

      btn.classList.remove('running', 'final-lap', 'finished', 'rank-1', 'rank-2', 'rank-3');

      lapsSpan.textContent = `${student.laps}/${totalLaps}圈`;

      const isFinalLap = !student.isFinished && totalLaps > 1 && student.laps === totalLaps - 1;

      if (student.isFinished) {
        btn.classList.add('finished');
        statusSpan.textContent = `完賽#${student.rank || 1}`;
      } else if (isFinalLap) {
        btn.classList.add('final-lap');
        statusSpan.textContent = student.rank ? `剩1圈#${student.rank}` : `剩1圈`;
      } else if (student.laps > 0) {
        btn.classList.add('running');
        statusSpan.textContent = student.rank ? `第${student.rank}名` : `進行中`;

        if (student.rank === 1) btn.classList.add('rank-1');
        else if (student.rank === 2) btn.classList.add('rank-2');
        else if (student.rank === 3) btn.classList.add('rank-3');
      } else {
        statusSpan.textContent = '準備';
      }
    });

    if (leaderboardPanel.classList.contains('active')) {
      renderLeaderboardPanel();
    }
  }

  /**
   * 渲染名次榜面板清單 (供老師謄寫全體排序)
   */
  function renderLeaderboardPanel() {
    const finishedCount = students.filter(s => s.isFinished).length;
    panelSummary.textContent = `完賽: ${finishedCount} / ${TOTAL_STUDENTS} 人`;

    leaderboardList.innerHTML = '';

    const sorted = [...students].sort((a, b) => {
      if (a.isFinished && b.isFinished) return a.finishTime - b.finishTime;
      if (a.isFinished) return -1;
      if (b.isFinished) return 1;
      if (b.laps !== a.laps) return b.laps - a.laps;
      if (a.laps > 0) return a.lastUpdated - b.lastUpdated;
      return a.bib - b.bib;
    });

    sorted.forEach((student, index) => {
      const card = document.createElement('div');
      card.className = 'rank-card';
      if (index === 0 && student.laps > 0) card.classList.add('top-1');
      if (index === 1 && student.laps > 0) card.classList.add('top-2');
      if (index === 2 && student.laps > 0) card.classList.add('top-3');

      const leftDiv = document.createElement('div');
      leftDiv.className = 'rank-card-left';

      const orderSpan = document.createElement('span');
      orderSpan.className = 'rank-order';
      orderSpan.textContent = student.rank ? `#${student.rank}` : `-`;
      leftDiv.appendChild(orderSpan);

      const nameSpan = document.createElement('span');
      nameSpan.className = 'rank-bib-name';
      nameSpan.textContent = `${student.bibStr} 號`;
      leftDiv.appendChild(nameSpan);

      card.appendChild(leftDiv);

      const rightDiv = document.createElement('div');
      rightDiv.className = 'rank-card-right';

      const lapBadge = document.createElement('span');
      lapBadge.className = 'rank-lap-badge';
      lapBadge.textContent = `${student.laps} / ${totalLaps} 圈`;
      rightDiv.appendChild(lapBadge);

      const statusBadge = document.createElement('span');
      statusBadge.className = 'rank-status-badge';
      if (student.isFinished) {
        statusBadge.classList.add('finished');
        statusBadge.textContent = '已完賽';
      } else if (totalLaps > 1 && student.laps === totalLaps - 1) {
        statusBadge.classList.add('final-lap');
        statusBadge.textContent = '剩最後1圈';
      } else if (student.laps > 0) {
        statusBadge.textContent = '競賽中';
      } else {
        statusBadge.textContent = '尚未出發';
      }
      rightDiv.appendChild(statusBadge);

      card.appendChild(rightDiv);
      leaderboardList.appendChild(card);
    });
  }

  /**
   * 綁定頂部控制項事件
   */
  function bindControlEvents() {
    totalLapsSelect.addEventListener('change', (e) => {
      const newTotal = parseInt(e.target.value, 10);
      if (newTotal >= 1 && newTotal <= 8) {
        totalLaps = newTotal;
        students.forEach(s => {
          if (s.laps >= totalLaps) {
            s.isFinished = true;
            if (!s.finishTime) s.finishTime = s.lastUpdated || Date.now();
          } else {
            s.isFinished = false;
            s.finishTime = 0;
          }
        });
        onRaceStateChanged(null, `已將總圈數設定為 ${totalLaps} 圈`);
      }
    });

    undoBtn.addEventListener('click', () => {
      undoLastAction();
    });

    // 重設按鈕 (內聯二階段防呆確認，無彈窗)
    resetBtn.addEventListener('click', () => {
      if (!isResetConfirming) {
        isResetConfirming = true;
        resetBtn.classList.add('confirming');
        resetBtnText.textContent = '確定重設?';

        if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
        resetConfirmTimer = setTimeout(() => {
          isResetConfirming = false;
          resetBtn.classList.remove('confirming');
          resetBtnText.textContent = '重設';
        }, RESET_TIMEOUT_MS);
      } else {
        if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
        isResetConfirming = false;
        resetBtn.classList.remove('confirming');
        resetBtnText.textContent = '重設';

        initStudents();
        historyStack = [];
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}

        onRaceStateChanged(null, '所有圈數與名次已歸零重設');
      }
    });

    viewToggleBtn.addEventListener('click', () => {
      const isOpen = leaderboardPanel.classList.toggle('active');
      viewToggleText.textContent = isOpen ? '網格' : '名次';
      if (isOpen) {
        renderLeaderboardPanel();
      }
    });

    closeLeaderboardBtn.addEventListener('click', () => {
      leaderboardPanel.classList.remove('active');
      viewToggleText.textContent = '名次';
    });
  }

  /**
   * 啟動系統
   */
  function startApp() {
    initStudents();
    const hasSaved = loadSavedState();
    buildButtonsGrid();
    bindControlEvents();
    calculateRankings();
    renderAllButtons();
    updateUndoButtonState();
    updateStatusBanners(hasSaved ? '已恢復上次競賽紀錄' : null);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startApp);
  } else {
    startApp();
  }
})();
  </script>
</body>
