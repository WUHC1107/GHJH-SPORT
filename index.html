<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GHJH SPORT</title>
  <meta name="description" content="GHJH SPORT - 運動會徑賽計圈與即時排名系統">
  <style>
    /* =========================================================
       GHJH SPORT - 運動會徑賽計圈與即時排名系統
       設計哲學：高對比大字、一屏全覽無需滑動、極致直覺觸控
       ========================================================= */

    :root {
      /* 深色運動科技配色 (預設) */
      --bg-primary: #0b0f19;
      --bg-surface: #151d2f;
      --bg-surface-elevated: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      /* 按鈕狀態配色 */
      --btn-idle-bg: #1e293b;
      --btn-idle-border: #475569;
      --btn-idle-text: #f1f5f9;

      --btn-running-bg: #1d4ed8;
      --btn-running-border: #3b82f6;
      --btn-running-text: #ffffff;

      /* 最後一圈醒目高亮 (亮橘黃+霓虹警示) */
      --final-lap-bg: #f59e0b;
      --final-lap-border: #fef08a;
      --final-lap-text: #000000;
      --final-lap-glow: rgba(245, 158, 11, 0.5);

      /* 完賽配色 */
      --finished-bg: #065f46;
      --finished-border: #10b981;
      --finished-text: #ecfdf5;

      /* 強調與操作鍵 */
      --accent-undo: #e11d48;
      --accent-undo-hover: #be123c;
      --accent-gold: #facc15;
      --accent-silver: #cbd5e1;
      --accent-bronze: #d97706;

      /* 尺寸與間距 */
      --gap-grid: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    /* 烈日戶外高對比模式 (操場強烈日照環境) */
    body.theme-outdoor {
      --bg-primary: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #e2e8f0;
      --border-color: #94a3b8;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;

      --btn-idle-bg: #ffffff;
      --btn-idle-border: #475569;
      --btn-idle-text: #0f172a;

      --btn-running-bg: #1d4ed8;
      --btn-running-border: #1e40af;
      --btn-running-text: #ffffff;

      --final-lap-bg: #ea580c;
      --final-lap-border: #b45309;
      --final-lap-text: #ffffff;
      --final-lap-glow: rgba(234, 88, 12, 0.5);

      --finished-bg: #047857;
      --finished-border: #065f46;
      --finished-text: #ffffff;
    }

    /* 全域基礎設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* 嚴格禁止捲動，符合完全不需滑動需求 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      touch-action: manipulation; /* 防止雙擊螢幕縮放 */
    }

    /* 應用程式主容器：嚴格 100dvh flex 縱向排版 */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      max-width: 600px; /* 手機端最佳比例限制 */
      margin: 0 auto;
      position: relative;
      background-color: var(--bg-primary);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ----------------------------------------------------
       頂部資訊列 (Header)
       ---------------------------------------------------- */
    .app-header {
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 8px 4px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .brand-badge {
      font-size: 1.15rem;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 操作按鈕 (復原、排名、設定、主題) */
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 33px;
      padding: 0 9px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
      transition: all 0.12s ease;
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    /* 復原按鈕特化 (極醒目，避免誤觸) */
    .btn-undo {
      background-color: var(--accent-undo);
      border-color: #f43f5e;
      color: #ffffff;
      padding: 0 9px;
    }

    .btn-undo:disabled {
      background-color: var(--bg-surface-elevated);
      border-color: var(--border-color);
      color: var(--text-muted);
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .undo-badge {
      display: none;
      background-color: #ffffff;
      color: #be123c;
      font-size: 0.72rem;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 800;
      margin-left: 2px;
    }

    .undo-badge.active {
      display: inline-block;
    }

    /* ----------------------------------------------------
       最後一圈醒目提醒看板 (專為裁判呼喊設計)
       ---------------------------------------------------- */
    .bell-banner {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: var(--radius-sm);
      padding: 3px 6px;
      min-height: 30px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .bell-banner.has-alert {
      background: linear-gradient(90deg, #f59e0b 0%, #ea580c 100%);
      border-color: #fde047;
      color: #000000;
      box-shadow: 0 0 10px var(--final-lap-glow);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    .bell-label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bell-banner.has-alert .bell-label {
      color: #000000;
    }

    .bell-list {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      white-space: nowrap;
      flex: 1;
    }

    .bell-list::-webkit-scrollbar {
      display: none;
    }

    .empty-tip {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .bell-banner.has-alert .empty-tip {
      display: none;
    }

    /* 最後一圈號碼徽章 */
    .final-bib-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #facc15;
      font-size: 0.84rem;
      font-weight: 900;
      padding: 1px 7px;
      border-radius: 4px;
      border: 1px solid #000000;
      animation: pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop-in {
      0% { transform: scale(0.6); }
      100% { transform: scale(1); }
    }

    /* ----------------------------------------------------
       領先與目標圈數摘要列
       ---------------------------------------------------- */
    .leader-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-secondary);
      padding: 0 2px;
    }

    .leader-info {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .leader-title {
      font-weight: 700;
      color: var(--text-muted);
    }

    .leader-summary {
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .laps-counter {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .highlight-text {
      color: #38bdf8;
      font-weight: 900;
    }

    /* ----------------------------------------------------
       核心號碼按鈕網格 (Grid)
       確保完全不捲動、填滿剩餘高度
       ---------------------------------------------------- */
    .grid-main {
      flex: 1;
      min-height: 0; /* 關鍵：防止 flex item 溢出造成滾動 */
      padding: 3px;
      display: flex;
      overflow: hidden;
    }

    .students-grid {
      width: 100%;
      height: 100%;
      display: grid;
      /* 5 欄 × 6 列 = 30 個按鈕 */
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: var(--gap-grid);
    }

    /* 單個選手按鈕 */
    .student-btn {
      position: relative;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--btn-idle-border);
      background-color: var(--btn-idle-bg);
      color: var(--btn-idle-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }

    .student-btn:active {
      transform: scale(0.92);
    }

    /* 號碼數字：特大字號、極度醒目 */
    .student-bib {
      font-size: clamp(1.2rem, 5.2vw, 1.8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }

    /* 圈數與進度文字 */
    .student-status-text {
      font-size: clamp(0.66rem, 2.5vw, 0.82rem);
      font-weight: 700;
      line-height: 1.1;
      margin-top: 1px;
      opacity: 0.95;
    }

    /* 右上角即時排名角標 */
    .student-rank-badge {
      position: absolute;
      top: 1px;
      right: 2px;
      font-size: clamp(0.55rem, 2vw, 0.68rem);
      font-weight: 800;
      padding: 0 3px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      display: none;
    }

    .student-rank-badge.visible {
      display: block;
    }

    .student-rank-badge.rank-1 {
      background: #facc15;
      color: #000000;
    }

    .student-rank-badge.rank-2 {
      background: #e2e8f0;
      color: #000000;
    }

    .student-rank-badge.rank-3 {
      background: #f97316;
      color: #ffffff;
    }

    /* 底部圈數微型進度條 */
    .student-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.2);
      width: 100%;
    }

    .student-progress-fill {
      height: 100%;
      width: 0%;
      background-color: #38bdf8;
      transition: width 0.2s ease;
    }

    /* ----------------------------------------------------
       選手按鈕各種狀態樣式
       ---------------------------------------------------- */
    /* 狀態 1：進行中 (1 ~ 總圈數-2) */
    .student-btn.state-running {
      background-color: var(--btn-running-bg);
      border-color: var(--btn-running-border);
      color: var(--btn-running-text);
    }

    .student-btn.state-running .student-progress-fill {
      background-color: #60a5fa;
    }

    /* 狀態 2：最後一圈 (剩最後1圈) - 極醒目警示 */
    .student-btn.state-final-lap {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      border-color: #fef08a;
      border-width: 2.5px;
      color: #000000;
      box-shadow: 0 0 10px var(--final-lap-glow);
      animation: final-pulse 1.8s infinite;
    }

    @keyframes final-pulse {
      0%, 100% { border-color: #ffffff; transform: scale(1); }
      50% { border-color: #fde047; transform: scale(1.02); }
    }

    .student-btn.state-final-lap .student-bib {
      color: #000000;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .student-btn.state-final-lap .student-status-text {
      color: #000000;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.85);
      padding: 0 3px;
      border-radius: 3px;
    }

    .student-btn.state-final-lap .student-progress-fill {
      background-color: #ffffff;
    }

    /* 狀態 3：完賽 (已跑完所有圈數) */
    .student-btn.state-finished {
      background: var(--finished-bg);
      border-color: var(--finished-border);
      color: var(--finished-text);
      opacity: 0.85;
    }

    .student-btn.state-finished .student-progress-fill {
      background-color: #34d399;
    }

    .student-btn.state-finished .student-status-text {
      color: #a7f3d0;
      font-weight: 800;
    }

    /* 未參賽號碼 (若選手數設定小於30) */
    .student-btn.state-disabled {
      opacity: 0.15;
      pointer-events: none;
      filter: grayscale(1);
    }

    /* ----------------------------------------------------
       底部資訊列 (Footer)
       ---------------------------------------------------- */
    .app-footer {
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 2px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 22px;
    }

    .status-message {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-message.highlight {
      color: #facc15;
      font-weight: 700;
    }

    /* ----------------------------------------------------
       抽屜面板 (Drawer) - 無彈窗、滑出式檢視
       ---------------------------------------------------- */
    .drawer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-surface-elevated);
    }

    .drawer-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drawer-icon {
      font-size: 1.1rem;
    }

    .drawer-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .drawer-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .drawer-close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px;
    }

    /* 排名總表樣式 */
    .rank-table-header {
      display: grid;
      grid-template-columns: 46px 65px 1fr 90px;
      padding: 8px 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 46px 65px 1fr 90px;
      align-items: center;
      padding: 8px 8px;
      background-color: var(--bg-surface-elevated);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      font-size: 0.88rem;
    }

    .rank-row.top-1 {
      border-left: 4px solid var(--accent-gold);
    }
    .rank-row.top-2 {
      border-left: 4px solid var(--accent-silver);
    }
    .rank-row.top-3 {
      border-left: 4px solid var(--accent-bronze);
    }

    .rank-row.status-final {
      background-color: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
    }

    .rank-row.status-finished {
      background-color: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
    }

    .col-rank-num {
      font-weight: 900;
      font-size: 1rem;
    }

    .col-bib-num {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
    }

    .col-laps-detail {
      font-weight: 600;
      font-size: 0.82rem;
    }

    .status-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: 800;
      text-align: center;
    }

    .status-tag.tag-running {
      background-color: #1e3a8a;
      color: #93c5fd;
    }

    .status-tag.tag-final {
      background-color: #f59e0b;
      color: #000000;
    }

    .status-tag.tag-done {
      background-color: #059669;
      color: #ecfdf5;
    }

    /* ----------------------------------------------------
       設定抽屜樣式
       ---------------------------------------------------- */
    .settings-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .setting-tip {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .number-stepper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stepper-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stepper-btn:active {
      background-color: #334155;
    }

    .number-stepper input {
      width: 80px;
      height: 44px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    .setting-divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 4px 0;
    }

    .setting-danger-zone {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background-color: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.3);
      border-radius: var(--radius-sm);
    }

    .danger-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #f43f5e;
    }

    .danger-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-danger-confirm {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid #f43f5e;
      background-color: #be123c;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-danger-confirm.confirming {
      background-color: #e11d48;
      border-color: #ffffff;
      animation: pulse-danger 0.8s infinite;
    }

    @keyframes pulse-danger {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.98); }
    }

    .drawer-backdrop {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 90;
    }

    .drawer-backdrop.active {
      display: block;
    }

    /* 橫向模式適配 (若使用者將手機橫放) */
    @media (orientation: landscape) {
      .students-grid {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
    }
  </style>
</head>

        </div>

          <label for="inputTotalAthletes" class="setting-label">參賽人數 (1 ~ 30 人)</label>
          <div class="number-stepper">
            <button type="button" class="stepper-btn" id="btnAthMinus">-</button>
            <input type="number" id="inputTotalAthletes" min="1" max="30" value="30" readonly>
            <button type="button" class="stepper-btn" id="btnAthPlus">+</button>
          </div>
          <span class="setting-tip">預設 30 位，30 個按鈕同屏全覽，無需滾動滑動</span>
        </div>

        <div class="setting-divider"></div>

        <!-- 重設比賽：採雙重確認，無系統彈窗 -->

          <p class="danger-desc">清除所有圈數、名次與計時記錄。此操作將重新開始。</p>
          <button id="btnResetMatch" class="btn-danger-confirm">
            <span class="reset-icon">🔄</span>

          </button>

    <!-- 點擊覆蓋幕 (點擊背景收起抽屜) -->
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
  </div>

  <script>
    /**
     * GHJH SPORT - 運動會徑賽計圈與即時排名系統
     * 特性：高對比大字、一屏全覽、零滑動、多步復原、零彈窗、零音效、純前端離線
     */
    (function () {
      'use strict';

      // ----------------------------------------------------
      // 常數與初始設定
      // ----------------------------------------------------
      const STORAGE_KEY = 'GHJH_SPORT_STATE_V1';
      const DEFAULT_TOTAL_LAPS = 8;       // 預設至多 8 圈
      const DEFAULT_ATHLETES_COUNT = 30;  // 預設 30 位學生

      // 全域狀態
      let state = {
        totalLaps: DEFAULT_TOTAL_LAPS,
        totalAthletes: DEFAULT_ATHLETES_COUNT,
        athletes: [],       // 陣列長度 30
        history: [],        // 動作歷程 (用於 Undo)
        actionSeq: 0,       // 全域動作序號計數器
        finishCount: 0,     // 已完賽人數
        outdoorTheme: false // 戶外烈日高對比模式
      };

      // ----------------------------------------------------
      // DOM 元素快取
      // ----------------------------------------------------
      const elements = {
        gridContainer: document.getElementById('gridContainer'),
        btnUndo: document.getElementById('btnUndo'),
        undoTargetBadge: document.getElementById('undoTargetBadge'),
        bellBanner: document.getElementById('bellBanner'),
        finalLapList: document.getElementById('finalLapList'),
        leaderSummary: document.getElementById('leaderSummary'),
        targetLapsDisplay: document.getElementById('targetLapsDisplay'),
        statusMessage: document.getElementById('statusMessage'),

        // 抽屜與按鈕
        btnRankToggle: document.getElementById('btnRankToggle'),
        rankDrawer: document.getElementById('rankDrawer'),
        btnCloseRank: document.getElementById('btnCloseRank'),
        rankListContainer: document.getElementById('rankListContainer'),
        rankDrawerLapInfo: document.getElementById('rankDrawerLapInfo'),

        btnSettingsToggle: document.getElementById('btnSettingsToggle'),
        settingsDrawer: document.getElementById('settingsDrawer'),
        btnCloseSettings: document.getElementById('btnCloseSettings'),
        inputTotalLaps: document.getElementById('inputTotalLaps'),
        btnLapMinus: document.getElementById('btnLapMinus'),
        btnLapPlus: document.getElementById('btnLapPlus'),
        inputTotalAthletes: document.getElementById('inputTotalAthletes'),
        btnAthMinus: document.getElementById('btnAthMinus'),
        btnAthPlus: document.getElementById('btnAthPlus'),
        btnResetMatch: document.getElementById('btnResetMatch'),
        resetBtnText: document.getElementById('resetBtnText'),

        btnThemeToggle: document.getElementById('btnThemeToggle'),
        themeIcon: document.getElementById('themeIcon'),
        drawerBackdrop: document.getElementById('drawerBackdrop')
      };

      // ----------------------------------------------------
      // 狀態初始化與 LocalStorage 持久化
      // ----------------------------------------------------
      function initAthletes() {
        state.athletes = [];
        for (let i = 1; i <= 30; i++) {
          state.athletes.push({
            id: i,
            bib: i < 10 ? '0' + i : '' + i,
            laps: 0,
            lastTimestamp: 0,
            lastSeq: 0,
            finishRank: null, // 完賽名次 (1, 2, 3...)
            finishTime: null
          });
        }
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            state.totalLaps = parsed.totalLaps || DEFAULT_TOTAL_LAPS;
            state.totalAthletes = parsed.totalAthletes || DEFAULT_ATHLETES_COUNT;
            state.athletes = parsed.athletes || [];
            state.history = parsed.history || [];
            state.actionSeq = parsed.actionSeq || 0;
            state.finishCount = parsed.finishCount || 0;
            state.outdoorTheme = !!parsed.outdoorTheme;

            // 確保 30 位選手結構完整
            if (!state.athletes || state.athletes.length !== 30) {
              initAthletes();
            }
          } else {
            initAthletes();
          }
        } catch (e) {
          initAthletes();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            totalLaps: state.totalLaps,
            totalAthletes: state.totalAthletes,
            athletes: state.athletes,
            history: state.history,
            actionSeq: state.actionSeq,
            finishCount: state.finishCount,
            outdoorTheme: state.outdoorTheme
          }));
        } catch (e) {}
      }

      // ----------------------------------------------------
      // 排名計算核心算法
      // ----------------------------------------------------
      function calculateRankings() {
        const activeAthletes = state.athletes.filter(a => a.id <= state.totalAthletes);

        // 排序權重：
        // 1. 已完賽者最前 (依 finishRank 遞增)
        // 2. 未完賽者依完成圈數 laps 由大到小
        // 3. 圈數相同時，依據達成最後一圈的 sequence/timestamp 先後 (先達成者前)
        // 4. 0 圈者依號碼由小到大排列在後
        const sorted = [...activeAthletes].sort((a, b) => {
          const aDone = a.laps >= state.totalLaps;
          const bDone = b.laps >= state.totalLaps;

          if (aDone && bDone) {
            return (a.finishRank || 999) - (b.finishRank || 999);
          }
          if (aDone && !bDone) return -1;
          if (!aDone && bDone) return 1;

          // 雙方皆未完賽
          if (a.laps !== b.laps) {
            return b.laps - a.laps; // 圈數多者領先
          }

          // 圈數相同
          if (a.laps > 0) {
            return a.lastSeq - b.lastSeq; // 先完成該圈者領先
          }

          return a.id - b.id; // 均為 0 圈按號碼排
        });

        // 映射當前即時名次 (1 ~ totalAthletes)
        const rankMap = new Map();
        sorted.forEach((athlete, index) => {
          rankMap.set(athlete.id, index + 1);
        });

        return { sorted, rankMap };
      }

      // ----------------------------------------------------
      // 核心計圈與操作邏輯
      // ----------------------------------------------------
      let clickCoolDowns = new Map(); // 針對單一號碼防連按抖動 (300ms)

      function recordLap(athleteId) {
        const now = Date.now();
        const lastClick = clickCoolDowns.get(athleteId) || 0;
        if (now - lastClick < 300) {
          return; // 忽略過於快速的誤連按
        }
        clickCoolDowns.set(athleteId, now);

        const athlete = state.athletes.find(a => a.id === athleteId);
        if (!athlete || athlete.id > state.totalAthletes) return;

        if (athlete.laps >= state.totalLaps) {
          showStatusMessage(`#${athlete.bib} 號已完賽 (第 ${athlete.finishRank} 名)`, true);
          return;
        }

        // 儲存操作前快照 (供 Undo)
        state.actionSeq++;
        const prevLaps = athlete.laps;
        const prevTimestamp = athlete.lastTimestamp;
        const prevSeq = athlete.lastSeq;
        const prevFinishRank = athlete.finishRank;

        // 推進 1 圈
        athlete.laps++;
        athlete.lastTimestamp = now;
        athlete.lastSeq = state.actionSeq;

        // 檢查是否完賽
        let newlyFinished = false;
        if (athlete.laps >= state.totalLaps) {
          state.finishCount++;
          athlete.finishRank = state.finishCount;
          athlete.finishTime = now;
          newlyFinished = true;
        }

        // 記錄至歷史堆疊 (支援多步 Undo)
        state.history.push({
          action: 'LAP_INCREMENT',
          athleteId: athlete.id,
          bib: athlete.bib,
          prevLaps,
          prevTimestamp,
          prevSeq,
          prevFinishRank,
          newlyFinished
        });

        // 狀態反饋
        const isFinalLap = (athlete.laps === state.totalLaps - 1);
        if (newlyFinished) {
          showStatusMessage(`🏁 #${athlete.bib} 號完賽！獲得第 ${athlete.finishRank} 名`, true);
        } else if (isFinalLap) {
          showStatusMessage(`🔔 #${athlete.bib} 號進入最後 1 圈！請提醒選手！`, true);
        } else {
          showStatusMessage(`✓ #${athlete.bib} 號完成第 ${athlete.laps}/${state.totalLaps} 圈`);
        }

        // 輕微震動反饋 (行動裝置原生支援，絕無音效)
        if (navigator.vibrate) {
          if (isFinalLap) {
            navigator.vibrate([70, 40, 70]);
          } else {
            navigator.vibrate(30);
          }
        }

        saveState();
        render();
      }

      // 復原按鈕 (Undo)
      function undoLastAction() {
        if (state.history.length === 0) return;

        const lastAction = state.history.pop();
        const athlete = state.athletes.find(a => a.id === lastAction.athleteId);

        if (lastAction.action === 'LAP_INCREMENT') {
          if (lastAction.newlyFinished) {
            state.finishCount = Math.max(0, state.finishCount - 1);
          }
          athlete.laps = lastAction.prevLaps;
          athlete.lastTimestamp = lastAction.prevTimestamp;
          athlete.lastSeq = lastAction.prevSeq;
          athlete.finishRank = lastAction.prevFinishRank;

          showStatusMessage(`↶ 已復原：#${athlete.bib} 號回到 ${athlete.laps} 圈`, true);
        } else if (lastAction.action === 'LAP_DECREMENT') {
          athlete.laps = lastAction.prevLaps;
          athlete.lastTimestamp = lastAction.prevTimestamp;
          athlete.lastSeq = lastAction.prevSeq;
          athlete.finishRank = lastAction.prevFinishRank;

          showStatusMessage(`↶ 已復原：#${athlete.bib} 號還原為 ${athlete.laps} 圈`, true);
        }

        saveState();
        render();
      }

      // 手動減 1 圈 (長按號碼按鈕觸發，用於個別號碼校正)
      function decrementLap(athleteId) {
        const athlete = state.athletes.find(a => a.id === athleteId);
        if (!athlete || athlete.laps <= 0) return;

        state.actionSeq++;
        const prevLaps = athlete.laps;
        const prevTimestamp = athlete.lastTimestamp;
        const prevSeq = athlete.lastSeq;
        const prevFinishRank = athlete.finishRank;
        const wasFinished = (athlete.laps >= state.totalLaps);

        if (wasFinished) {
          state.finishCount = Math.max(0, state.finishCount - 1);
          athlete.finishRank = null;
          athlete.finishTime = null;
        }

        athlete.laps--;
        athlete.lastTimestamp = Date.now();
        athlete.lastSeq = state.actionSeq;

        state.history.push({
          action: 'LAP_DECREMENT',
          athleteId: athlete.id,
          bib: athlete.bib,
          prevLaps,
          prevTimestamp,
          prevSeq,
          prevFinishRank,
          wasFinished
        });

        showStatusMessage(`⚠️ 已將 #${athlete.bib} 號倒退 1 圈 (現為 ${athlete.laps} 圈)`, true);

        if (navigator.vibrate) {
          navigator.vibrate(50);
        }

        saveState();
        render();
      }

      // ----------------------------------------------------
      // 重置比賽 (雙重無彈窗確認)
      // ----------------------------------------------------
      let resetConfirmTimer = null;
      function handleResetMatch() {
        if (!elements.btnResetMatch.classList.contains('confirming')) {
          // 第一次點擊：進入確認狀態
          elements.btnResetMatch.classList.add('confirming');
          elements.resetBtnText.textContent = '⚠️ 請在 3 秒內再點一次以確認重設！';

          clearTimeout(resetConfirmTimer);
          resetConfirmTimer = setTimeout(() => {
            elements.btnResetMatch.classList.remove('confirming');
            elements.resetBtnText.textContent = '重新開始新比賽';
          }, 3000);
        } else {
          // 第二次點擊：真正重置
          clearTimeout(resetConfirmTimer);
          elements.btnResetMatch.classList.remove('confirming');
          elements.resetBtnText.textContent = '重新開始新比賽';

          initAthletes();
          state.history = [];
          state.actionSeq = 0;
          state.finishCount = 0;

          saveState();
          closeDrawers();
          render();
          showStatusMessage('✨ 比賽數據已重置，準備開始！', true);
        }
      }

      // ----------------------------------------------------
      // 介面渲染 (Render)
      // ----------------------------------------------------
      function render() {
        const { sorted, rankMap } = calculateRankings();
        const finalLapAthletes = [];

        // 1. 渲染 30 個選手號碼按鈕
        elements.gridContainer.innerHTML = '';
        
        state.athletes.forEach(athlete => {
          const btn = document.createElement('div');
          btn.className = 'student-btn';
          btn.dataset.id = athlete.id;

          // 檢查是否超出參賽人數
          if (athlete.id > state.totalAthletes) {
            btn.classList.add('state-disabled');
          }

          const isFinished = athlete.laps >= state.totalLaps;
          const isFinalLap = !isFinished && athlete.laps === (state.totalLaps - 1);
          const isRunning = !isFinished && !isFinalLap && athlete.laps > 0;

          if (isFinished) {
            btn.classList.add('state-finished');
          } else if (isFinalLap) {
            btn.classList.add('state-final-lap');
            if (athlete.id <= state.totalAthletes) {
              finalLapAthletes.push(athlete);
            }
          } else if (isRunning) {
            btn.classList.add('state-running');
          }

          // 號碼數字
          const bibEl = document.createElement('div');
          bibEl.className = 'student-bib';
          bibEl.textContent = athlete.bib;

          // 圈數與狀態文字
          const statusEl = document.createElement('div');
          statusEl.className = 'student-status-text';
          if (isFinished) {
            statusEl.textContent = `完賽 No.${athlete.finishRank}`;
          } else if (isFinalLap) {
            statusEl.textContent = `🔔剩1圈`;
          } else if (athlete.laps === 0) {
            statusEl.textContent = `0圈`;
          } else {
            statusEl.textContent = `${athlete.laps}/${state.totalLaps}圈`;
          }

          // 右上角即時排名小角標 (有跑動時才顯示)
          const rankBadge = document.createElement('div');
          rankBadge.className = 'student-rank-badge';
          if (athlete.laps > 0 && athlete.id <= state.totalAthletes) {
            const curRank = rankMap.get(athlete.id);
            rankBadge.textContent = `#${curRank}`;
            rankBadge.classList.add('visible');
            if (curRank === 1) rankBadge.classList.add('rank-1');
            else if (curRank === 2) rankBadge.classList.add('rank-2');
            else if (curRank === 3) rankBadge.classList.add('rank-3');
          }

          // 底部微型進度條
          const progressBar = document.createElement('div');
          progressBar.className = 'student-progress-bar';
          const progressFill = document.createElement('div');
          progressFill.className = 'student-progress-fill';
          const progressPercent = Math.min(100, Math.round((athlete.laps / state.totalLaps) * 100));
          progressFill.style.width = `${progressPercent}%`;
          progressBar.appendChild(progressFill);

          btn.appendChild(rankBadge);
          btn.appendChild(bibEl);
          btn.appendChild(statusEl);
          btn.appendChild(progressBar);

          // 點擊事件與長按微調綁定
          bindButtonEvents(btn, athlete.id);

          elements.gridContainer.appendChild(btn);
        });

        // 2. 渲染最後一圈提醒看板 (專為裁判高喊提醒)
        renderBellBanner(finalLapAthletes);

        // 3. 渲染頂部即時領先摘要
        renderLeaderSummary(sorted);

        // 4. 更新復原按鈕狀態
        renderUndoButton();

        // 5. 更新設定面板數值與抽屜排名
        elements.targetLapsDisplay.textContent = `${state.totalLaps} 圈`;
        elements.inputTotalLaps.value = state.totalLaps;
        elements.inputTotalAthletes.value = state.totalAthletes;
        elements.rankDrawerLapInfo.textContent = `(目標 ${state.totalLaps} 圈 / 參賽 ${state.totalAthletes} 人)`;

        if (elements.rankDrawer.classList.contains('open')) {
          renderRankDrawer(sorted);
        }
      }

      // 綁定號碼按鈕觸控 (點擊 + 長按倒退1圈)
      function bindButtonEvents(btn, athleteId) {
        let pressTimer = null;
        let isLongPress = false;

        const startPress = () => {
          isLongPress = false;
          pressTimer = setTimeout(() => {
            isLongPress = true;
            decrementLap(athleteId);
          }, 700); // 長按 700ms 觸發微調倒退
        };

        const cancelPress = () => {
          clearTimeout(pressTimer);
        };

        btn.addEventListener('touchstart', startPress, { passive: true });
        btn.addEventListener('touchend', () => {
          cancelPress();
          if (!isLongPress) {
            recordLap(athleteId);
          }
        });
        btn.addEventListener('touchcancel', cancelPress);

        // 支援滑鼠操作 (PC 或測試時)
        btn.addEventListener('mousedown', startPress);
        btn.addEventListener('mouseup', () => {
          cancelPress();
          if (!isLongPress) {
            recordLap(athleteId);
          }
        });
        btn.addEventListener('mouseleave', cancelPress);
      }

      // 渲染最後一圈提醒看板
      function renderBellBanner(finalLapAthletes) {
        if (finalLapAthletes.length > 0) {
          elements.bellBanner.classList.add('has-alert');
          elements.finalLapList.innerHTML = '';
          finalLapAthletes.forEach(ath => {
            const chip = document.createElement('span');
            chip.className = 'final-bib-chip';
            chip.textContent = `#${ath.bib}`;
            elements.finalLapList.appendChild(chip);
          });
        } else {
          elements.bellBanner.classList.remove('has-alert');
          elements.finalLapList.innerHTML = '<span class="empty-tip">目前無進入最後一圈選手</span>';
        }
      }

      // 渲染即時領先摘要
      function renderLeaderSummary(sorted) {
        const runningOrDone = sorted.filter(a => a.laps > 0);
        if (runningOrDone.length === 0) {
          elements.leaderSummary.textContent = '比賽準備中，點擊號碼開始計圈';
          return;
        }

        const leaders = runningOrDone.slice(0, 3).map((a, i) => {
          const medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : '🥉');
          const status = a.laps >= state.totalLaps ? '完賽' : `${a.laps}圈`;
          return `${medal}#${a.bib}(${status})`;
        });

        elements.leaderSummary.textContent = leaders.join('  ');
      }

      // 渲染復原按鈕
      function renderUndoButton() {
        if (state.history.length > 0) {
          elements.btnUndo.disabled = false;
          const last = state.history[state.history.length - 1];
          elements.undoTargetBadge.textContent = `#${last.bib}`;
          elements.undoTargetBadge.classList.add('active');
        } else {
          elements.btnUndo.disabled = true;
          elements.undoTargetBadge.textContent = '';
          elements.undoTargetBadge.classList.remove('active');
        }
      }

      // 渲染排名抽屜總表
      function renderRankDrawer(sorted) {
        elements.rankListContainer.innerHTML = '';

        sorted.forEach((athlete, index) => {
          const rankNum = index + 1;
          const row = document.createElement('div');
          row.className = 'rank-row';

          if (rankNum === 1) row.classList.add('top-1');
          if (rankNum === 2) row.classList.add('top-2');
          if (rankNum === 3) row.classList.add('top-3');

          const isFinished = athlete.laps >= state.totalLaps;
          const isFinalLap = !isFinished && athlete.laps === (state.totalLaps - 1);

          if (isFinished) row.classList.add('status-finished');
          if (isFinalLap) row.classList.add('status-final');

          let statusHtml = '';
          if (isFinished) {
            statusHtml = `<span class="status-tag tag-done">完賽 (${athlete.finishRank})</span>`;
          } else if (isFinalLap) {
            statusHtml = `<span class="status-tag tag-final">🔔剩最後1圈</span>`;
          } else if (athlete.laps > 0) {
            statusHtml = `<span class="status-tag tag-running">進行中</span>`;
          } else {
            statusHtml = `<span class="status-tag" style="background:#334155;color:#94a3b8;">未出發</span>`;
          }

          row.innerHTML = `
            <div class="col-rank-num">${rankNum <= 3 ? ['🥇','🥈','🥉'][rankNum-1] : rankNum}</div>
            <div class="col-bib-num">#${athlete.bib}</div>
            <div class="col-laps-detail">${athlete.laps} / ${state.totalLaps} 圈</div>
            <div>${statusHtml}</div>
          `;

          elements.rankListContainer.appendChild(row);
        });
      }

      // 狀態列小提示
      let statusTimeout = null;
      function showStatusMessage(msg, isHighlight = false) {
        clearTimeout(statusTimeout);
        elements.statusMessage.textContent = msg;
        if (isHighlight) {
          elements.statusMessage.classList.add('highlight');
          statusTimeout = setTimeout(() => {
            elements.statusMessage.classList.remove('highlight');
            elements.statusMessage.textContent = '點擊號碼完成1圈｜長按號碼可倒退1圈';
          }, 3500);
        }
      }

      // ----------------------------------------------------
      // 抽屜控制 (完全無彈窗，側欄抽屜式滑出)
      // ----------------------------------------------------
      function openRankDrawer() {
        closeDrawers();
        const { sorted } = calculateRankings();
        renderRankDrawer(sorted);
        elements.rankDrawer.classList.add('open');
        elements.drawerBackdrop.classList.add('active');
      }

      function openSettingsDrawer() {
        closeDrawers();
        elements.settingsDrawer.classList.add('open');
        elements.drawerBackdrop.classList.add('active');
      }

      function closeDrawers() {
        elements.rankDrawer.classList.remove('open');
        elements.settingsDrawer.classList.remove('open');
        elements.drawerBackdrop.classList.remove('active');
      }

      // ----------------------------------------------------
      // 主題切換 (戶外烈日高對比模式)
      // ----------------------------------------------------
      function toggleOutdoorTheme() {
        state.outdoorTheme = !state.outdoorTheme;
        applyTheme();
        saveState();
      }

      function applyTheme() {
        if (state.outdoorTheme) {
          document.body.classList.remove('theme-dark');
          document.body.classList.add('theme-outdoor');
          elements.themeIcon.textContent = '🌙';
          elements.btnThemeToggle.title = '切換為深色運動模式';
        } else {
          document.body.classList.remove('theme-outdoor');
          document.body.classList.add('theme-dark');
          elements.themeIcon.textContent = '☀️';
          elements.btnThemeToggle.title = '切換為烈日高對比模式';
        }
      }

      // ----------------------------------------------------
      // 監聽與事件綁定
      // ----------------------------------------------------
      function bindGlobalEvents() {
        // 復原
        elements.btnUndo.addEventListener('click', undoLastAction);

        // 抽屜開啟與關閉
        elements.btnRankToggle.addEventListener('click', openRankDrawer);
        elements.btnCloseRank.addEventListener('click', closeDrawers);
        elements.btnSettingsToggle.addEventListener('click', openSettingsDrawer);
        elements.btnCloseSettings.addEventListener('click', closeDrawers);
        elements.drawerBackdrop.addEventListener('click', closeDrawers);

        // 主題模式切換
        elements.btnThemeToggle.addEventListener('click', toggleOutdoorTheme);

        // 總圈數調節
        elements.btnLapMinus.addEventListener('click', () => {
          if (state.totalLaps > 1) {
            state.totalLaps--;
            saveState();
            render();
          }
        });

        elements.btnLapPlus.addEventListener('click', () => {
          if (state.totalLaps < 20) {
            state.totalLaps++;
            saveState();
            render();
          }
        });

        // 參賽人數調節
        elements.btnAthMinus.addEventListener('click', () => {
          if (state.totalAthletes > 1) {
            state.totalAthletes--;
            saveState();
            render();
          }
        });

        elements.btnAthPlus.addEventListener('click', () => {
          if (state.totalAthletes < 30) {
            state.totalAthletes++;
            saveState();
            render();
          }
        });

        // 重設比賽按鈕
        elements.btnResetMatch.addEventListener('click', handleResetMatch);

        // 防止 iOS Safari 橡皮筋下拉捲動造成跳動
        document.addEventListener('touchmove', (e) => {
          if (!e.target.closest('.drawer-content')) {
            e.preventDefault();
          }
        }, { passive: false });
      }

      // ----------------------------------------------------
      // 啟動入口
      // ----------------------------------------------------
      loadState();
      applyTheme();
      bindGlobalEvents();
      render();

    })();
  </script>
</body>
</html>
